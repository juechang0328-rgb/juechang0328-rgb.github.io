<h1>隱私權政策</h1>
<ul>
<li>本工具僅供擁有者本人使用。</li>
<li>僅申請 Gmail 唯讀權限（gmail.readonly），用於讀取信用卡帳單信件。</li>

<li>使用者可隨時於 Google 帳戶的「第三方存取權」撤銷授權。</li>
